    <h2>Mosiah 6</h2>
<div class="guide-content" data-book-idx="8" data-chapter-idx="6" data-volume-key="guide4" data-volume-title="Pensée du jour"><div class="guide-entry" data-verse-end="7" data-verse-ref="Mosiah 6:1-7" data-verse-start="1" data-verse-text="¹Et alors, le roi Benjamin pensa qu’il était utile, après avoir fini de parler au peuple, de prendre les noms de tous ceux qui avaient conclu avec Dieu l’alliance de garder ses commandements.

²Et il arriva qu’il n’y eut pas une seule âme, si ce n’est les petits enfants, qui n’eût conclu l’alliance et n’eût pris sur elle le nom du Christ.

³Et en outre, il arriva que lorsque le roi Benjamin eut fini toutes ces choses, et eut consacré son fils Mosiah comme gouverneur et roi de son peuple, et lui eut donné tous ses ordres concernant le royaume, et eut aussi désigné des prêtres pour instruire le peuple, afin qu’il entendît et connût ainsi les commandements de Dieu, et afin de l’inciter à se souvenir du serment qu’il avait fait, il renvoya la multitude, et ils retournèrent tous, selon leurs familles, vers leurs maisons.

⁴Et Mosiah commença à régner à la place de son père. Et il commença à régner dans la trentième année de sa vie, ce qui faisait en tout environ quatre cent soixante-seize ans depuis le moment où Léhi avait quitté Jérusalem.

⁵Et le roi Benjamin vécut trois ans, et il mourut.

⁶Et il arriva que le roi Mosiah marcha dans les voies du Seigneur, et observa ses ordonnances et ses lois, et garda ses commandements dans tout ce qu’il lui commandait.

⁷Et le roi Mosiah commanda à son peuple de cultiver la terre. Et il cultiva, lui aussi, la terre, afin de ne pas devenir un fardeau pour son peuple, afin de faire en tout comme son père avait fait. Et il n’y eut pas de querelles parmi tout son peuple pendant trois ans." id="v1"><p>Les Écritures ont un pouvoir</p></div></div>
