    <h2>1 Nephi 1</h2>
<div class="guide-content" data-book-idx="1" data-chapter-idx="1" data-volume-key="guide4" data-volume-title="Pensée du jour"><div class="guide-entry" data-verse-end="25" data-verse-ref="1 Nephi 1:17-25" data-verse-start="17" data-verse-text="¹⁷Mais je vais faire le récit des actes de ma vie. Voici, je fais l’abrégé des annales de mon père sur des plaques que j’ai faites de mes propres mains ; c’est pourquoi, lorsque j’aurai abrégé les annales de mon père, je ferai le récit de ma vie.

¹⁸C’est pourquoi, je voudrais que vous sachiez que lorsque le Seigneur eut montré tant de choses merveilleuses à mon père, Léhi, oui, concernant la destruction de Jérusalem, voici, mon père s’en alla parmi le peuple et commença à prophétiser et à lui annoncer les choses qu’il avait vues et entendues.

¹⁹Et il arriva que les Juifs se moquèrent de lui à cause des choses dont il témoignait à leur sujet, car il témoignait vraiment de leur méchanceté et de leurs abominations, et il témoignait que les choses qu’il avait vues et entendues, et aussi les choses qu’il avait lues dans le livre, annonçaient clairement la venue d’un Messie et aussi la rédemption du monde.

²⁰Et lorsque les Juifs entendirent ces choses, ils furent en colère contre lui ; oui, tout comme ils l’avaient été contre les prophètes d’autrefois, qu’ils avaient chassés, et lapidés, et tués ; et ils attentèrent aussi à sa vie, afin de la lui ôter. Mais voici, moi, Néphi, je vais vous montrer que les tendres miséricordes du Seigneur sont sur tous ceux qu’il choisis à cause de leur foi, pour les rendre puissants au point même d’avoir le pouvoir de délivrance." id="v17"><p>Bonjour <br/>1 Néphi 1 : 17-25<br/>Temps de lecture (01:30)</p><p>Petite pensée pour nos malades. Bon rétablissement ❤️🤧😵‍💫</p></div></div>
