<div class="guide-content" data-book-idx="9" data-chapter-idx="59" data-volume-key="guide7" data-volume-title="BOM Evidence"><div class="guide-entry" data-verse-end="3" data-verse-ref="Alma 59:1-3" data-verse-start="1" data-verse-text="¹Or, il arriva, la trentième année du règne des juges sur le peuple de Néphi, lorsque Moroni eut reçu et lu l’épître d’Hélaman, qu’il se réjouit extrêmement du bien-être, oui, de l’extrême succès avec lequel Hélaman avait repris les terres qui avaient été perdues.

²Oui, et il le fit savoir à tout son peuple, dans tout le pays alentour dans cette région où il se trouvait, afin qu’il se réjouît aussi.

³Et il arriva qu’il envoya immédiatement une épître à Pahoran, désirant qu’il fît rassembler des hommes pour renforcer Hélaman, ou les armées d’Hélaman, afin qu’il pût conserver facilement cette partie du pays qu’il avait si miraculeusement aidé à reconquérir." id="v1"><h4 class="evidence-head">Evidence #214: Pre-Columbian Books</h4><p class="evidence-abstract"><em>Pre-Columbian writing and books were known from an early time in Mesoamerica, just as the Book of Mormon suggests.</em></p><p><a class="evidence-see-full" href="chapter_11_3.html#v1">Voir l'article complet (sources et notes) -&gt;</a></p></div></div>
